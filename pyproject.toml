[project]
name = "ecarbon"
version = "0.1.0"
description = "Automated takeoff-to-carbon pipeline: vector PDF plan set in, traceable A1-A3 whole-building LCA out."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "ifcopenshell>=0.8",
    "shapely>=2.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "httpx2>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ecarbon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
