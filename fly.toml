# Fly keeps a machine warm so a judge clicking the link gets an answer rather
# than a cold start. auto_stop_machines is off for the same reason: this is a
# demo that must respond on the first request, not a service optimising cost.
app = "ecarbon"
# sea is deprecated and refuses new machines; sjc is the nearest
# west-coast region to Edmonton that still provisions.
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

[[vm]]
  # A 46-page plan set peaks around 540 MB; 1 GB leaves room for the render
  # of a sheet at trace time without the machine being OOM-killed mid-demo.
  # Measured, not guessed: parsing one large set peaks near 900 MB and the
  # resident total climbs past 1 GB once several are cached. 2 GB was killed
  # by QC_Sixplex, taking every previously cached design with it.
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[checks.health]
  type = "http"
  port = 8080
  path = "/health"
  interval = "30s"
  # A generous timeout: /health itself is trivial, but it shares a core with
  # whatever request is parsing a drawing set, and a flapping check restarts
  # the machine.
  timeout = "15s"
  grace_period = "30s"
