# Fly keeps a machine warm so a judge clicking the link gets an answer rather
# than a cold start. auto_stop_machines is off for the same reason: this is a
# demo that must respond on the first request, not a service optimising cost.
app = "ecarbon"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

[[vm]]
  # A 46-page plan set peaks around 540 MB; 1 GB leaves room for the render
  # of a sheet at trace time without the machine being OOM-killed mid-demo.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[checks.health]
  type = "http"
  port = 8080
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
