# ==== Canada (added 25 Nov, after the UX session; Canada only) ===============
# Toronto's own pre-approved multiplexes (LGA Architectural Partners), electric
# variant. Written by Stream B before any reading rule was tuned on Canadian
# non-CMHC sets; scored once after the freeze. STREAM A: DO NOT OPEN.
#
# One template across the four: A001 assemblies, A002 door and window types,
# A011 site plan with per-floor areas, A100-A103 basement to third floor plans,
# A300-A302 sections. Datums on every section: basement -2.840, main 0.000,
# second 2.840, third 5.690, roof 8.145 (parapets 8.529 / 8.800).
# storeys counts the floor datums, basement included, as the scorer does.
# windows / doors: instances tagged on the four floor plans (W?## / D?##),
# skylights excluded; interior doors included.
# Structural plans (S-101..S-302) are images with no text; slab thickness is
# "refer to structural" on A001, so slab_mm is null.

ca-on-toronto-fourplex-narrow:
  footprint_m: [5.500, 17.000]   # A101 overall 5500 x 17000 (16711 wall to wall + bay)
  footprint_area_m2: 94.7        # A011 building coverage
