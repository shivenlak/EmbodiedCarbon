  storey_heights_m: [2.840, 2.840, 2.850, 2.455]
  windows: 19                    # A100 4, A101 5, A102 6, A103 4
  doors: 43
  slab_mm: null
  exterior_wall: "W1 2x6 wood stud 140 mm, R-24 batt, plywood, 64 mm mineral wool CI, vented cladding; W2 rated non-combustible 152 mm metal stud at the side yards (A001)"
