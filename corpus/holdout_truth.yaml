# Holdout-split truth for scripts/score_blind.py --split holdout.
#
# STREAM A: DO NOT OPEN. This file is the answer key for the blind test; the
# reading rules must never be tuned against it (docs/finals/SHARED.md, blind
# protocol). Written by Stream B on 24 Nov, before the feature freeze, and
# scored once after it.
#
# Read by eye off each set's drawings, with the same conventions as
# corpus/dev_truth.yaml. Facts only: the drawings themselves never enter git.
#
# footprint_m:        overall W x D in metres, off the overall dimension strings
# footprint_area_m2:  only where the footprint is not a rectangle; the area the
#                     sheet states (checked against the outline less its notch)
# storey_heights_m:   plate height per storey on a one-storey set
# windows / doors:    instances in the base schedule (QTY summed), or counted
#                     off the plan callouts where a set has no schedule;
#                     alternates, access hatches and options are left out
# null:               the set does not state it

