# The global corpus: plan sets from outside the CMHC catalogue.
#
# URLs and facts only. The PDFs never enter git. `scripts/fetch_corpus.py`
# downloads them into ~/ec-data/global/<id>/planset.pdf.
#
# split:      dev     -> Stream A (reading) may open, tune on, and score.
#             holdout -> Stream B (product) only. Scored once after the freeze.
#             todo    -> found but not downloaded yet; give it a split when it is.
# fetch:      direct  -> a plain HTTP download works.
#             browser -> the site blocks scripts; open `url` in a browser and
#                        save the file as ~/ec-data/global/<id>/planset.pdf.
# local_only: true    -> licence does not grant redistribution: local testing
#                        only, never bundled into deploy/data or the image.
#
# Keep a whole program (one architect / one template) inside one split, or the
# holdout leaks: the four Escondido sets share one template.

sets:
